[project]
name = "wellfound-agent"
version = "0.1.0"
description = "Local Wellfound job agent with Ollama matching and Playwright automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "ollama>=0.3.0",
]

[project.scripts]
wellfound-agent = "wellfound_agent.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
